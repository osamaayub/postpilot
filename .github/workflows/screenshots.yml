name: Screenshots

# Re-captures the README screenshots and demo GIF from the real app, so the docs never go stale.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "scripts/screenshots.mjs", ".github/workflows/screenshots.yml"]

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: screenshots-only-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright and ffmpeg
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Capture (built-in demo database, demo AI writer)
        run: |
          npm start -- -p 3100 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/ >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3100 node scripts/screenshots.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "docs: update screenshots [skip ci]"
          git pull --rebase origin main   # main may have moved while we were capturing
          git push
